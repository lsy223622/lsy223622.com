<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
  <title>lsy223622.com</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  <style>
    :root {
      color-scheme: dark light;
      --background: #0c1016;
      --background-secondary: #111723;
      --foreground: #f5f7fb;
      --muted: #9fa8b9;
      --muted-2: #778194;
      --accent: #c8d6f4;
      --grid: rgba(255,255,255,.05);
      --grid-mask: linear-gradient(115deg, rgba(0,0,0,.62), rgba(0,0,0,.32) 48%, transparent 92%);
      --panel-glow-1: rgba(145, 176, 255, .13);
      --panel-glow-2: rgba(101, 126, 196, .08);
      --tile-fill-a: rgba(73, 82, 104, .34);
      --tile-fill-b: rgba(42, 48, 63, .26);
      --tile-border: rgba(255,255,255,.12);
      --tile-shadow: inset 0 1px 1px rgba(255,255,255,.08), 0 8px 18px rgba(0,0,0,.16);
      --loose-fill-a: rgba(208, 221, 255, .60);
      --loose-fill-b: rgba(150, 171, 214, .42);
      --loose-border: rgba(244, 248, 255, .55);
      --loose-shadow-static: 0 18px 28px rgba(0,0,0,.22), inset 0 1px 1px rgba(255,255,255,.36), 0 0 28px rgba(161, 188, 255, .14);
      --tile-radius: 33%;
      --button-radius: 17px;
      --squircle-shape: superellipse(1.4);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --background: #f3f6fb;
        --background-secondary: #ebeff6;
        --foreground: #131823;
        --muted: #566074;
        --muted-2: #788298;
        --accent: #5e79b7;
        --grid: rgba(21,30,48,.055);
        --grid-mask: linear-gradient(115deg, rgba(0,0,0,.9), rgba(0,0,0,.62) 48%, transparent 92%);
        --panel-glow-1: rgba(129,161,236,.12);
        --panel-glow-2: rgba(154,173,214,.12);
        --tile-fill-a: rgba(255,255,255,.34);
        --tile-fill-b: rgba(233,238,247,.28);
        --tile-border: rgba(83,95,124,.12);
        --tile-shadow: inset 0 1px 1px rgba(255,255,255,.52), 0 8px 18px rgba(93,108,137,.08);
        --loose-fill-a: rgba(204, 220, 255, .64);
        --loose-fill-b: rgba(145, 168, 214, .46);
        --loose-border: rgba(255,255,255,.62);
        --loose-shadow-static: 0 16px 24px rgba(93,108,137,.14), inset 0 1px 1px rgba(255,255,255,.66), 0 0 34px rgba(123, 156, 235, .12);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 32%),
        linear-gradient(180deg, var(--background-secondary), var(--background));
      color: var(--foreground);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }

    .shell {
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(22px, 3.5vw, 48px) clamp(20px, 4.8vw, 72px) 10px;
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
      overflow: clip;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 62px 62px;
      -webkit-mask-image: var(--grid-mask);
      mask-image: var(--grid-mask);
    }
    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 16%, rgba(143,172,237,.07), transparent 20%),
        radial-gradient(circle at 82% 18%, rgba(143,172,237,.05), transparent 24%),
        radial-gradient(circle at 62% 72%, rgba(127,150,205,.05), transparent 26%);
      opacity: .9;
    }
    .stage { flex: 1; display: grid; place-items: center; padding: 55px 0; }
    .content {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: minmax(0, .98fr) minmax(0, .92fr);
      align-items: center;
      column-gap: clamp(46px, 6.4vw, 110px);
    }
    .text-side {
      min-width: 0;
      padding-left: clamp(18px, 3vw, 44px);
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .kicker::before { content: ""; width: 17px; height: 1px; background: currentColor; }
    h1 {
      margin: 25px 0 12px;
      font-size: clamp(52px, 5.8vw, 80px);
      line-height: 1.02;
      letter-spacing: -.075em;
      font-weight: 680;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: min(100%, 328px);
      gap: 12px;
      margin-top: 36px;
    }
    .site-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 50px;
      padding: 13px 17px;
      border: 1px solid var(--tile-border);
      border-radius: var(--button-radius);
      corner-shape: var(--squircle-shape);
      background: linear-gradient(145deg, var(--tile-fill-a), var(--tile-fill-b));
      box-shadow: var(--tile-shadow);
      color: var(--foreground);
      font-size: 14px;
      font-weight: 600;
      transition: transform .2s ease, border-color .2s ease;
    }
    .site-link span { color: var(--accent); font-size: 18px; line-height: 1; }
    .site-link:hover { transform: translateY(-2px); border-color: var(--accent); }
    .site-link, .tile {
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
    }

    .visual {
      display: grid;
      place-items: center;
      min-width: 0;
      position: relative;
      min-height: 420px;
    }
    .visual::before {
      content: "";
      position: absolute;
      width: min(100%, 440px);
      aspect-ratio: 1;
      border-radius: 28%;
      background:
        radial-gradient(circle at 70% 28%, var(--panel-glow-1), transparent 18%),
        radial-gradient(circle at 48% 58%, var(--panel-glow-2), transparent 32%);
      filter: blur(18px);
      opacity: .95;
      pointer-events: none;
    }
    .matrix {
      position: relative;
      width: min(62%, 280px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 5%;
      transform: rotate(-7deg);
      z-index: 1;
    }
    .tile {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--tile-border);
      border-radius: var(--tile-radius);
      corner-shape: var(--squircle-shape);
      background: linear-gradient(145deg, var(--tile-fill-a), var(--tile-fill-b));
      box-shadow: var(--tile-shadow);
    }
    .emblem {
      z-index: 1;
      position: relative;
      border-color: var(--loose-border);
      background: linear-gradient(135deg, var(--loose-fill-a), var(--loose-fill-b));
      box-shadow: var(--loose-shadow-static);
    }

    .text-side > :not(.actions) {
      animation: reveal .75s cubic-bezier(.16,1,.3,1) backwards;
    }
    .actions, .visual {
      animation: slide-in .75s cubic-bezier(.16,1,.3,1) backwards;
    }
    .kicker { animation-delay: .16s; }
    h1 { animation-delay: .23s; }
    .actions { animation-delay: .52s; }
    .visual { animation-delay: .17s; }
    .site-link { animation: fade-in .75s .52s cubic-bezier(.16,1,.3,1) backwards; }
    .matrix .tile { animation: tile-enter .65s cubic-bezier(.16,1,.3,1) backwards; }
    .matrix .tile:nth-child(3n + 1) { animation-delay: .36s; }
    .matrix .tile:nth-child(3n + 2) { animation-delay: .46s; }
    .matrix .tile:nth-child(3n) { animation-delay: .56s; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(13px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes tile-enter {
      from { opacity: 0; scale: .92; }
      to { opacity: 1; scale: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slide-in {
      from { transform: translateY(13px); }
      to { transform: translateY(0); }
    }

    @media (max-width: 800px) {
      .stage { padding: 31px 0 35px; }
      .content { max-width: 520px; grid-template-columns: 1fr; gap: 26px; }
      .visual { order: -1; min-height: 300px; }
      .visual::before { width: min(100%, 320px); }
      .matrix { width: min(72%, 238px); }
      .text-side { text-align: center; display: flex; flex-direction: column; align-items: center; padding-left: 0; }
      h1 { font-size: clamp(48px, 10vw, 68px); margin: 20px 0 0; }
      .actions { width: min(100%, 300px); margin-top: 29px; }
    }
    @media (max-width: 440px) {
      .shell { padding: 21px 18px 8px; }
      .stage { padding: 23px 0 27px; }
      .content { gap: 24px; }
      .visual { min-height: 270px; }
      .visual::before { width: min(100%, 292px); }
      .matrix { width: min(74%, 220px); }
      .kicker { font-size: 9px; }
      h1 { font-size: clamp(42px, 12vw, 52px); margin-top: 17px; }
    }
    @media (max-width: 350px) {
      .matrix { width: min(76%, 196px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    .domain-suffix { display: block; color: var(--accent); }
    .subtitle {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.5vw, 18px);
      font-weight: 450;
      line-height: 1.7;
      letter-spacing: .025em;
      animation-delay: .38s;
    }
    .emblem { display: grid; place-items: center; }
    .emblem svg { width: 64%; height: 64%; fill: #26344f; }
    .footer {
      flex-shrink: 0;
      padding-top: 22px;
      text-align: center;
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.8;
      animation: reveal .75s .6s cubic-bezier(.16,1,.3,1) both;
    }
    .footer p { margin: 0; }
    .footer a { display: inline-block; padding: 6px 8px; color: var(--muted-2); opacity: .5; transition: opacity .2s ease; }
    .footer a:hover { opacity: 1; }
    @media (max-width: 800px) {
      .subtitle { margin-top: 20px; font-size: 16px; }
      .stage { padding: 22px 0; }
      .visual { min-height: 275px; }
      .content { gap: 18px; }
      .footer { padding-top: 18px; }
    }
    @media (max-width: 440px) {
      .visual { min-height: 235px; }
      .matrix { width: min(70%, 202px); }
      .content { gap: 16px; }
      .subtitle { font-size: 14px; margin-top: 17px; }
      .actions { margin-top: 27px; }
    }
  </style>
</head>

        <div class="visual" aria-hidden="true">
          <div class="matrix">

          <path d="M780,240h-270c-16.5,0-30,13.5-30,30v120c0,16.5,13.5,30,30,30h130c11,0,20,9,20,20,0,0,0,460,0,460,0,33,27,60,60,60,0,0,270,0,270,0,16.5,0,30-13.5,30-30v-120c0-16.5-13.5-30-30-30h-130c-11,0-20-9-20-20,0,0,0-460,0-460,0-33-27-60-60-60Z" />

    </main>
    <footer class="footer">
      <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">陕ICP备2021014185号</a></p>

  </div>
